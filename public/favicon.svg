<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Code Brackets & Slash </> -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 190 160 L 100 256 L 190 352" fill="none" stroke="url(#cyanGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slash / -->
    <line x1="285" y1="140" x2="227" y2="372" stroke="url(#cyanGrad)" stroke-width="38" stroke-linecap="round"/>
    <!-- Right Bracket > -->
    <path d="M 322 160 L 412 256 L 322 352" fill="none" stroke="url(#cyanGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
